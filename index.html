<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stars</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: var(--tg-theme-bg-color,#fff); --fg: var(--tg-theme-text-color,#111); --card: var(--tg-theme-secondary-bg-color,#f4f4f6); --btn: var(--tg-theme-button-color,#2f80ed); --btnfg: var(--tg-theme-button-text-color,#fff); }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  h1 { font-size:22px; margin:0 0 8px; }
  .bal { background:var(--card); border-radius:14px; padding:12px 14px; margin:12px 0; display:flex; justify-content:space-between; }
  input { width:100%; padding:12px; border-radius:12px; border:1px solid #ccc; font-size:16px; background:var(--card); color:var(--fg); margin-bottom:12px; }
  .pk { display:flex; justify-content:space-between; padding:14px; margin-bottom:8px; background:var(--card); border-radius:12px; border:2px solid transparent; cursor:pointer; }
  .pk.sel { border-color:var(--btn); }
  button { width:100%; padding:14px; border:0; border-radius:12px; background:var(--btn); color:var(--btnfg); font-size:16px; font-weight:600; margin-top:8px; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<h1>⭐ Telegram Stars</h1>
<div class="bal"><span>Balans</span><b id="bal"></b></div>
<input id="rec" placeholder="@username (qabul qiluvchi)">
<div id="pks"></div>
<input id="custom" type="number" inputmode="numeric" placeholder="Yoki miqdorni kiriting (50–10000)">
<button id="buy" disabled>Xarid qilish</button>
<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
const q = new URLSearchParams(location.search);
const bal = +q.get("bal") || 0, price = +q.get("price") || 260;
const PACKS = [50, 100, 300, 500, 1000];
let stars = 0;
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("ru-RU") + " so'm";

$("bal").textContent = fmt(bal);
if (q.get("u")) $("rec").value = "@" + q.get("u");
$("pks").innerHTML = PACKS.map(p => `<div class="pk" data-p="${p}"><span>⭐ ${p}</span><b>${fmt(p*price)}</b></div>`).join("");

function refresh() {
  $("buy").disabled = !(stars >= 50 && stars <= 10000);
  $("buy").textContent = stars ? `Xarid qilish · ${fmt(stars*price)}` : "Xarid qilish";
}
document.querySelectorAll(".pk").forEach(el => el.onclick = () => {
  stars = +el.dataset.p; $("custom").value = "";
  document.querySelectorAll(".pk").forEach(x => x.classList.toggle("sel", x === el));
  refresh();
});
$("custom").oninput = e => {
  stars = +e.target.value || 0;
  document.querySelectorAll(".pk").forEach(x => x.classList.remove("sel"));
  refresh();
};
$("buy").onclick = () => {
  const recipient = $("rec").value.trim();
  if (!/^@?[A-Za-z0-9_]{5,32}$/.test(recipient)) return tg.showAlert("Username noto'g'ri");
  tg.sendData(JSON.stringify({ recipient, stars }));  // botga yuboradi va oynani yopadi
};
refresh();
</script>
</body>
</html>
